[package]
name = "ardftsrc"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
num-traits.workspace = true
realfft.workspace = true
thiserror.workspace = true
audioadapter = { workspace = true, optional = true }
audio-core = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
rodio = { version = "0.22", default-features = false, optional = true }
tracing = { version = "0.1", optional = true }
pxfm = { version = "0.1.29", optional = true }
twofloat = { workspace = true, optional = true }
num-complex = { workspace = true, optional = true }
num-integer = { workspace = true, optional = true }
transpose = { workspace = true, optional = true }

[dev-dependencies]
audioadapter-buffers.workspace = true
criterion.workspace = true
dasp_signal.workspace = true
md5.workspace = true
rubato.workspace = true
serde.workspace = true
serde_json.workspace = true
wavers.workspace = true
mimalloc.workspace = true

[features]
default = ["avx", "neon", "sse", "wasm_simd"]

# SIMD features (enabled by default)
avx = ["realfft/avx"]
neon = ["realfft/neon"]
sse = ["realfft/sse"]
wasm_simd = ["realfft/wasm_simd"]

# Optional features (disabled by default)
bessel = ["dep:pxfm"]
rodio = ["dep:rodio"]
rayon = ["dep:rayon"]
audioadapter = ["dep:audio-core", "dep:audioadapter"]
tracing = ["dep:tracing"]

# Double-double (~106-bit) precision FFT backend for extreme `quality` settings, as an optional,
# much slower, offline-oriented alternative to the default `realfft`-backed pipeline. See
# `src/dd_fft/mod.rs` for how and why. `strength_reduce` and `primal-check` (small helpers the
# vendored FFT algorithms depend on) are vendored as source under `src/dd_fft/vendor/` rather than
# pulled in as Cargo dependencies -- see that module's docs.
extended-precision-fft = [
    "dep:twofloat",
    "dep:num-complex",
    "dep:num-integer",
    "dep:transpose",
]

 # Rodio features (examples only)
rodio-playback= ["rodio/playback"]

[[bench]]
name = "ardftsrc_throughput"
harness = false

[[bench]]
name = "ardftsrc_chunk_time"
harness = false

[[bench]]
name = "rubato_sync"
harness = false

[[example]]
name = "rodio_adapter"
required-features = ["rodio-playback"]

[[example]]
name = "rodio_adapter_with_spans"
required-features = ["rodio-playback"]

[package.metadata.docs.rs]
features = ["rodio"]
